<!DOCTYPE html>
<html lang="lt" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lietuvos miestų baseinai — žemėlapis</title>
<!-- Pico CSS: lightweight (~10KB gzip) classless/semantic base + the "cyan"
     color theme, which reads as water/pool-appropriate. It gives buttons,
     focus rings, and general typography sane modern defaults; our own
     rules below (loaded after, and more specific where it matters) keep
     the custom brand look for the header, pins, panel and cards. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.cyan.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --deep:   #0d2b3e;
    --water:  #146b83;
    --aqua:   #2ea3a8;
    --foam:   #eef6f5;
    --sand:   #e8ab55;
    --selected:#d1495b;
    --ink:    #10222b;
    --muted:  #5c7680;
    --card:   #ffffff;

    /* Shared design tokens for a consistent, modern component look */
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 18px;
    --r-pill: 999px;
    --shadow-sm: 0 2px 8px rgba(13,43,62,0.18);
    --shadow-md: 0 10px 30px rgba(13,43,62,0.20);
    --shadow-lg: 0 16px 40px rgba(13,43,62,0.26);
    --ease: cubic-bezier(.2,.7,.3,1);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color:var(--ink);
    background:var(--foam);
  }
  /* Pico applies its own line-height/font-size to headings and body; keep
     our compact custom sizing everywhere in this app rather than Pico's
     prose defaults. */
  h1, h2, h3, p{ line-height:1.3; }
  #app{ height:100vh; display:flex; flex-direction:column; }

  header{
    background: linear-gradient(120deg, var(--deep), var(--water) 70%);
    color:#f2fbfa;
    padding:18px 24px 16px;
    display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
    box-shadow:0 2px 10px rgba(13,43,62,0.25);
    z-index:20; position:relative;
  }
  header h1{
    margin:0; font-size:1.35rem; font-weight:700; letter-spacing:0.2px;
  }
  header .count{
    font-size:0.82rem; color:#b9e4e0; font-weight:500;
  }
  header .hint{
    margin-left:auto; font-size:0.78rem; color:#bfe1de;
    display:flex; align-items:center; gap:6px;
  }
  header .hint svg{ width:14px; height:14px; flex:none; }
  header .panel-toggle{
    margin-left:auto;
    align-self:center;
    background:rgba(255,255,255,0.14);
    color:#f2fbfa;
    border:1px solid rgba(255,255,255,0.35);
    border-radius:var(--r-pill);
    padding:8px 16px;
    font-size:0.8rem;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    display:flex; align-items:center; gap:7px;
    transition: background 160ms var(--ease), transform 160ms var(--ease), box-shadow 160ms var(--ease);
    white-space:nowrap;
  }
  header .panel-toggle:hover{ background:rgba(255,255,255,0.28); transform:translateY(-1px); box-shadow:var(--shadow-sm); }
  header .panel-toggle:active{ transform:translateY(0); }
  header .panel-toggle[aria-expanded="true"]{ background:#fff; color:var(--deep); border-color:#fff; }
  header .panel-toggle svg{ width:15px; height:15px; flex:none; }

  #mapwrap{ flex:1; position:relative; min-height:0; overflow:hidden; }
  #map{ position:absolute; inset:0; background:#dfeef0; }

  /* Leaflet marker override */
  .pool-pin{
    width:26px; height:26px;
    border-radius:50% 50% 50% 0;
    background:var(--aqua);
    border:2px solid #ffffff;
    box-shadow:var(--shadow-sm);
    transform: rotate(-45deg);
    display:flex; align-items:center; justify-content:center;
    transition: transform 160ms var(--ease), background 160ms var(--ease), box-shadow 160ms var(--ease);
  }
  .pool-pin::after{
    content:"";
    width:8px; height:8px;
    border-radius:50%;
    background:#ffffff;
  }
  .pool-pin.hovered{
    background:var(--sand);
    transform: rotate(-45deg) scale(1.18);
  }
  .pool-pin.selected{
    background:var(--selected);
    transform: rotate(-45deg) scale(1.28);
    box-shadow:0 0 0 5px rgba(209,73,91,0.25), 0 2px 6px rgba(13,43,62,0.45);
  }

  /* Hover info card */
  #infocard{
    position:absolute;
    top:16px; right:16px;
    width:300px;
    max-width:calc(100vw - 32px);
    background:rgba(255,255,255,0.92);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border:1px solid rgba(255,255,255,0.6);
    border-radius:var(--r-lg);
    box-shadow:var(--shadow-md);
    padding:16px 18px 14px;
    z-index:30;
    pointer-events:none;
    opacity:0;
    visibility:hidden;
    transform:translateY(-8px) scale(0.98);
    transition:opacity 160ms var(--ease), transform 160ms var(--ease), visibility 160ms;
  }
  #infocard.show{ opacity:1; visibility:visible; transform:translateY(0) scale(1); }
  #infocard h2{
    margin:0 0 2px; font-size:1.02rem; line-height:1.25; color:var(--deep);
  }
  #infocard .city-tag{
    display:inline-block;
    font-size:0.7rem; font-weight:700; letter-spacing:0.3px;
    color:var(--water);
    background:#e2f2f1;
    border-radius:20px;
    padding:2px 9px;
    margin:4px 0 10px;
  }
  #infocard .row{
    font-size:0.82rem; color:var(--muted);
    margin:6px 0;
    line-height:1.4;
    display:flex; gap:8px;
  }
  #infocard .row svg{ width:15px; height:15px; flex:none; margin-top:1px; color:var(--aqua); }
  #infocard .hours-note{
    font-size:0.76rem; color:#8a6a2c; background:#fbf1de; border-radius:8px;
    padding:6px 8px; margin-top:8px;
  }
  #infocard .site-btn{
    pointer-events:auto;
    display:inline-flex; align-items:center; gap:6px;
    margin-top:12px;
    background:var(--water);
    color:#fff; text-decoration:none;
    font-size:0.82rem; font-weight:600;
    padding:9px 16px; border-radius:var(--r-pill);
    box-shadow:var(--shadow-sm);
    transition: background 160ms var(--ease), transform 160ms var(--ease), box-shadow 160ms var(--ease);
  }
  #infocard .site-btn:hover{ background:var(--deep); transform:translateY(-1px); box-shadow:var(--shadow-md); }
  #infocard .site-btn:active{ transform:translateY(0); }
  #infocard .site-btn svg{ width:13px; height:13px; }

  /* Leaflet popup (click) styling */
  .leaflet-popup-content-wrapper{
    border-radius:var(--r-md);
    box-shadow:var(--shadow-md);
  }
  .leaflet-popup-content{
    font-family: inherit;
    font-size:0.85rem;
    line-height:1.4;
    margin:12px 14px;
  }
  .leaflet-popup-content b{ color:var(--deep); }
  .popup-site{
    display:inline-block; margin-top:8px;
    background:var(--water); color:#fff !important;
    padding:7px 14px; border-radius:var(--r-pill);
    text-decoration:none; font-weight:600; font-size:0.8rem;
    transition: background 160ms var(--ease);
  }
  .popup-site:hover{ background:var(--deep); }

  /* Slide-out pool list panel */
  #poolPanel{
    position:absolute;
    top:0; right:0; bottom:0;
    width:320px;
    max-width:85vw;
    background:rgba(255,255,255,0.94);
    backdrop-filter:saturate(180%) blur(16px);
    -webkit-backdrop-filter:saturate(180%) blur(16px);
    border-left:1px solid rgba(13,43,62,0.08);
    border-radius:var(--r-lg) 0 0 var(--r-lg);
    box-shadow:var(--shadow-lg);
    z-index:40;
    display:flex;
    flex-direction:column;
    transform:translateX(100%);
    transition:transform 260ms var(--ease);
  }
  #poolPanel.open{ transform:translateX(0); }
  #poolPanel .panel-header{
    flex:none;
    padding:18px 20px 14px;
    border-bottom:1px solid #e2eef0;
    display:flex; align-items:center; justify-content:space-between;
  }
  #poolPanel .panel-header h2{
    margin:0; font-size:1.02rem; font-weight:700; color:var(--deep);
  }
  .panel-close{
    background:#eef6f5; border:none; cursor:pointer;
    color:var(--muted); font-size:1rem; line-height:1;
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition: background 160ms var(--ease), color 160ms var(--ease), transform 160ms var(--ease);
  }
  .panel-close:hover{ background:var(--selected); color:#fff; transform:rotate(90deg); }
  #poolList{
    overflow-y:auto; flex:1; padding:10px 12px;
    display:flex; flex-direction:column; gap:6px;
    scrollbar-width:thin; scrollbar-color:var(--aqua) transparent;
  }
  #poolList::-webkit-scrollbar{ width:8px; }
  #poolList::-webkit-scrollbar-thumb{ background:#bcdedc; border-radius:var(--r-pill); }
  #poolList::-webkit-scrollbar-thumb:hover{ background:var(--aqua); }
  .pool-item{
    padding:10px 14px;
    cursor:pointer;
    border-radius:var(--r-md);
    border:1px solid transparent;
    border-left:3px solid transparent;
    transition:background 140ms var(--ease), border-color 140ms var(--ease), transform 140ms var(--ease);
  }
  .pool-item:hover{ background:var(--foam); transform:translateX(-2px); }
  .pool-item.active{
    background:#e2f2f1;
    border-color:#cfe9e6;
    border-left-color:var(--selected);
  }
  .pool-item .pi-name{
    font-weight:600; font-size:0.85rem; color:var(--ink); line-height:1.3;
  }
  .pool-item .pi-city{
    font-size:0.74rem; color:var(--muted); margin-top:2px;
  }

  footer{
    background:var(--deep); color:#8fb9c2;
    font-size:0.72rem; padding:7px 20px;
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px;
    z-index:20; position:relative;
  }
  footer a{ color:#cfe9e6; }

  @media (max-width: 620px){
    header h1{ font-size:1.1rem; }
    header .hint{ display:none; }
    #infocard{ left:12px; right:12px; width:auto; top:auto; bottom:12px; }
    #poolPanel{ width:100%; max-width:100%; border-radius:0; }
  }
</style>
</head>

    <span class="count" id="countLabel">27 vietos</span>
    <span class="hint">

      Užveskite pelę ant žymeklio, spauskite nuorodą svetainei atverti
    </span>
    <button id="panelToggle" class="panel-toggle" aria-expanded="false" aria-controls="poolPanel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      Sąrašas
    </button>
  </header>

  <div id="mapwrap">
    <div id="map"></div>
    <div id="infocard"></div>

    <div id="poolPanel">
      <div class="panel-header">
        <h2>Visi baseinai</h2>
        <button id="panelClose" class="panel-close" aria-label="Uždaryti sąrašą">✕</button>
      </div>
      <div id="poolList"></div>
    </div>
  </div>

  <footer>
    <span>Duomenų šaltinis: kelionessuvaikais.lt sąrašas · žymeklių padėtys apytikslės (miesto lygio), tikslinti pagal poreikį.</span>

</div>

const infocard = document.getElementById('infocard');

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showCard(pool){
  infocard.innerHTML = `
    <h2>${escapeHtml(pool.name)}</h2>
    <span class="city-tag">${escapeHtml(pool.city)}</span>
    <div class="row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 1 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span>${escapeHtml(pool.address)}</span>
    </div>
    <div class="row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <span>${escapeHtml(pool.hours)}</span>
    </div>
    <a class="site-btn" href="${pool.website}" target="_blank" rel="noopener">
      Atverti svetainę
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg>
    </a>
  `;
  infocard.classList.add('show');
}

function hideCard(){
  infocard.classList.remove('show');
}

// ---------------------------------------------------------------------
// Slide-out side panel: full pool list + click-to-highlight selection.
// This is wired up BEFORE the map/Leaflet code below and doesn't touch
// `map`/`markers` directly (only through the null-checked selectPool),
// so the list still opens and is clickable even if the map itself fails
// to load (e.g. tiles/Leaflet blocked or no network) — previously this
// whole block sat after the map code, so a Leaflet load error aborted
// the script before the panel's click listeners were ever attached.
// ---------------------------------------------------------------------
let map = null;
const markers = [];
let selectedIdx = null;

const panelToggle = document.getElementById('panelToggle');
const poolPanel   = document.getElementById('poolPanel');
const panelClose  = document.getElementById('panelClose');
const poolListEl  = document.getElementById('poolList');

function openPanel(){
  poolPanel.classList.add('open');
  panelToggle.setAttribute('aria-expanded', 'true');
}
function closePanel(){
  poolPanel.classList.remove('open');
  panelToggle.setAttribute('aria-expanded', 'false');
}
panelToggle.addEventListener('click', () => {
  poolPanel.classList.contains('open') ? closePanel() : openPanel();
});
panelClose.addEventListener('click', closePanel);

// Build the list, sorted by city then name. Each row keeps a data-idx
// pointing back into POOLS/markers so selection stays in sync either way.
const listOrder = POOLS.map((_, i) => i).sort((a, b) =>
  POOLS[a].city.localeCompare(POOLS[b].city, 'lt') ||
  POOLS[a].name.localeCompare(POOLS[b].name, 'lt')
);

listOrder.forEach(idx => {
  const pool = POOLS[idx];
  const item = document.createElement('div');
  item.className = 'pool-item';
  item.dataset.idx = idx;
  item.innerHTML = `<div class="pi-name">${escapeHtml(pool.name)}</div><div class="pi-city">${escapeHtml(pool.city)}</div>`;
  item.addEventListener('click', () => selectPool(idx, { fromList: true }));
  poolListEl.appendChild(item);
});

function selectPool(idx, opts = {}){
  // List highlight + info card work regardless of whether the map loaded.
  document.querySelectorAll('.pool-item').forEach(el => {
    el.classList.toggle('active', Number(el.dataset.idx) === idx);
  });
  const activeItem = poolListEl.querySelector(`.pool-item[data-idx="${idx}"]`);
  if (activeItem) activeItem.scrollIntoView({ block: 'nearest' });

  showCard(POOLS[idx]);

  // Pin color change + map pan only run when the map actually loaded.
  const marker = markers[idx];
  if (marker) {
    if (selectedIdx !== null && markers[selectedIdx] && markers[selectedIdx]._icon) {
      markers[selectedIdx]._icon.querySelector('.pool-pin').classList.remove('selected');
    }
    if (marker._icon) marker._icon.querySelector('.pool-pin').classList.add('selected');
    if (map) map.panTo(marker.getLatLng());
  }
  selectedIdx = idx;

  // On small screens, close the panel after picking from the list so the
  // highlighted pin on the map is immediately visible.
  if (opts.fromList && window.innerWidth <= 620) closePanel();
}

// ---------------------------------------------------------------------
// Map setup — wrapped so a Leaflet/tile load failure can't take the rest
// of the page (including the list above) down with it.
// ---------------------------------------------------------------------
try {
  map = L.map('map', { zoomControl:true }).setView([55.25, 23.9], 7);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  function poolIcon(){
    return L.divIcon({
      className: '',
      html: '<div class="pool-pin"></div>',
      iconSize: [26,26],
      iconAnchor: [13,26],
      popupAnchor: [0,-24]
    });
  }

  POOLS.forEach((pool, idx) => {
    const marker = L.marker([pool.lat, pool.lng], { icon: poolIcon() }).addTo(map);

    marker.on('mouseover', function(){
      this._icon.querySelector('.pool-pin').classList.add('hovered');
      showCard(pool);
    });
    marker.on('mouseout', function(){
      if (this._icon) this._icon.querySelector('.pool-pin').classList.remove('hovered');
      hideCard();
    });
    // Clicking a pin on the map also syncs the list's highlight.
    marker.on('click', () => selectPool(idx));

    // Click (useful on touch devices where hover doesn't exist): popup with a
    // real link — the new tab only opens when that link itself is pressed.
    marker.bindPopup(
      `<b>${escapeHtml(pool.name)}</b><br>${escapeHtml(pool.city)}<br>${escapeHtml(pool.hours)}<br>
       <a class="popup-site" href="${pool.website}" target="_blank" rel="noopener">Atverti svetainę ↗</a>`
    );

    markers[idx] = marker;
  });

  // Fit map to all markers with some padding
  const group = L.featureGroup(markers);
  map.fitBounds(group.getBounds().pad(0.15));
} catch (err) {
  console.error('Žemėlapio įkelti nepavyko:', err);
  document.getElementById('map').innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;height:100%;padding:24px;text-align:center;color:#5c7680;font-size:0.9rem;">Nepavyko įkelti žemėlapio (patikrinkite interneto ryšį). Baseinų sąrašas dešinėje vis tiek veikia.</div>';
}
</script>
</body>
</html>
