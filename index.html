<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; }

  header.app-header {
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--pico-muted-border-color);
    flex: 0 0 auto;
  }
  header.app-header h1 { font-size: 1.1rem; margin: 0; }
  header.app-header p { margin: 0.15rem 0 0; font-size: 0.85rem; color: var(--pico-muted-color); }

  .layout {
    flex: 1 1 auto;
    display: flex;
    min-height: 0; /* allow children to scroll */
  }

  #map {
    flex: 0 0 66.6667%;
    height: 100%;
  }

  #list-panel {
    flex: 0 0 33.3333%;
    height: 100%;
    overflow-y: auto;
    padding: 0.75rem;
    border-left: 1px solid var(--pico-muted-border-color);
    box-sizing: border-box;
  }

  #list-panel h2 {
    font-size: 1rem;
    margin: 0 0 0.75rem;
  }

  .pool-item {
    cursor: pointer;
    padding: 0.6rem 0.7rem;
    margin-bottom: 0.4rem;
    border-radius: var(--pico-border-radius);
    border: 1px solid var(--pico-muted-border-color);
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .pool-item:hover {
    background-color: var(--pico-muted-border-color);
  }
  .pool-item.active {
    background-color: var(--pico-primary);
    border-color: var(--pico-primary);
  }
  .pool-item.active strong,
  .pool-item.active .pool-city {
    color: var(--pico-primary-inverse);
  }

  .pool-item strong { display: block; font-size: 0.95rem; }
  .pool-item .pool-city { font-size: 0.8rem; color: var(--pico-muted-color); }

  .popup-content h4 { margin: 0 0 0.35rem; font-size: 1rem; }
  .popup-content p { margin: 0.15rem 0; font-size: 0.85rem; }
  .popup-content ul { margin: 0.35rem 0; padding-left: 1.1rem; font-size: 0.85rem; }
  .popup-content a { font-size: 0.85rem; }

  /* Custom pin marker: plain SVG glyph, no box/background behind it */
  .pin-icon,
  .leaflet-div-icon.pin-icon {
    background: transparent;
    border: none;
  }
  .pin-icon svg { display: block; }

  /*
    Pico's global CSS styles any element with role="button" (which Leaflet's
    zoom control links use) as a full padded button. Reset those links back
    to Leaflet's own small square control look.
  */
  .leaflet-bar a {
    all: unset;
    display: block !important;
    box-sizing: border-box !important;
    width: 26px !important;
    height: 26px !important;
    line-height: 26px !important;
    text-align: center !important;
    cursor: pointer !important;
    background-color: #fff !important;
    color: #333 !important;
    font: bold 18px 'Lucida Console', Monaco, monospace !important;
    text-decoration: none !important;
  }
  .leaflet-bar a:hover { background-color: #f4f4f4 !important; }
  .leaflet-bar a:first-child { border-radius: 4px 4px 0 0 !important; }
  .leaflet-bar a:last-child {
    border-radius: 0 0 4px 4px !important;
    border-top: 1px solid #ccc !important;
  }
  .leaflet-bar {
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
  }

  /* Leaflet makes markers keyboard-focusable; drop Pico's focus ring so no
     stray box appears around a pin or control when it's clicked/focused. */
  .leaflet-container a:focus,
  .leaflet-container a:focus-visible,
  .leaflet-marker-icon:focus,
  .leaflet-marker-icon:focus-visible {
    outline: none !important;
    box-shadow: none !important;
  }

  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    #map { flex: 0 0 55%; width: 100%; }
    #list-panel { flex: 0 0 45%; width: 100%; border-left: none; border-top: 1px solid var(--pico-muted-border-color); }
  }
</style>

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
const DAY_LT = {
  monday: "Pirmadienis", tuesday: "Antradienis", wednesday: "Trečiadienis",
  thursday: "Ketvirtadienis", friday: "Penktadienis", saturday: "Šeštadienis", sunday: "Sekmadienis"
};

function formatHoursLabel(key) {
  if (key === "note") return "Pastaba";
  return key.split("_").map(p => DAY_LT[p] || p).join("–");
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function popupHtml(pool) {
  const hours = Object.entries(pool.working_hours || {})
    .map(([k, v]) => `<li><strong>${escapeHtml(formatHoursLabel(k))}:</strong> ${escapeHtml(v)}</li>`)
    .join("");

  return `
    <div class="popup-content">
      <h4>${escapeHtml(pool.name)}</h4>
      <p>${escapeHtml(pool.address)}</p>
      ${hours ? `<ul>${hours}</ul>` : ""}
      ${pool.website ? `<p><a href="${escapeHtml(pool.website)}" target="_blank" rel="noopener">Svetainė</a></p>` : ""}
    </div>
  `;
}

// ---------------------------------------------------------------------------
// Map setup
// ---------------------------------------------------------------------------
const map = L.map("map").setView([55.3, 23.9], 7);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

// Plain SVG pin, no background box — color is swapped to highlight the active pool.
const PIN_COLOR_DEFAULT = "#2563eb";
const PIN_COLOR_ACTIVE = "#e63946";

function pinIcon(color) {
  const svg = `
    <svg width="28" height="40" viewBox="0 0 28 40" xmlns="http://www.w3.org/2000/svg">
      <path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 26 14 26s14-15.5 14-26c0-7.7-6.3-14-14-14z"
            fill="${color}" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="14" cy="14" r="5.5" fill="#ffffff"/>
    </svg>`;
  return L.divIcon({
    className: "pin-icon",
    html: svg,
    iconSize: [28, 40],
    iconAnchor: [14, 40],
    popupAnchor: [0, -36]
  });
}

const markers = [];
let activeIndex = null;

function setActive(index) {
  if (activeIndex !== null) {
    const prevItem = document.querySelector(`.pool-item[data-index="${activeIndex}"]`);
    if (prevItem) prevItem.classList.remove("active");
    markers[activeIndex].setIcon(pinIcon(PIN_COLOR_DEFAULT));
  }
  activeIndex = index;
  markers[index].setIcon(pinIcon(PIN_COLOR_ACTIVE));
  const item = document.querySelector(`.pool-item[data-index="${index}"]`);
  if (item) {
    item.classList.add("active");
    item.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}

pools.forEach((pool, index) => {
  const marker = L.marker([pool.coordinates.lat, pool.coordinates.lng], { icon: pinIcon(PIN_COLOR_DEFAULT) }).addTo(map);
  marker.bindPopup(popupHtml(pool), { autoPan: false });
  marker.on("click", () => setActive(index));
  markers.push(marker);
});

// ---------------------------------------------------------------------------
// List panel
// ---------------------------------------------------------------------------
const listEl = document.getElementById("pool-list");
document.getElementById("pool-count").textContent = pools.length;

pools.forEach((pool, index) => {
  const item = document.createElement("div");
  item.className = "pool-item";
  item.dataset.index = index;
  item.innerHTML = `<strong>${escapeHtml(pool.name)}</strong><span class="pool-city">${escapeHtml(pool.city)}</span>`;
  item.addEventListener("click", () => {
    const marker = markers[index];
    setActive(index);
    marker.openPopup();
  });
  listEl.appendChild(item);
});
</script>
